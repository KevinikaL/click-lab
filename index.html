<!DOCTYPE html>
<html>
  <head>
    <title>Color Mixing Quiz</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.classless.min.css"
    >

    <link rel="stylesheet" href="css/card.css">
    <link rel="stylesheet" href="css/choice-list.css">
    <link rel="stylesheet" href="css/scoreboard.css">
    <link rel="stylesheet" href="css/choice-list-buttons.css">
    <link rel="stylesheet" href="css/button-faces.css">
    <link rel="stylesheet" href="css/style.css">
  </head>

  <body>
    <main class="quiz-container">

    <h1 id="headline-1">Color Mixing Quiz 🎨</h1>

    <p id="tagline-1">Can you mix the right colors?</p>
    <div class="score-area">
     <p>Score:</p>
     <p class="scoreboard">0</p>
    </div>

    <!-- QUESTION 1 -->

    <div class="card">

      <h2 id="question-1">
        <span class="question-number">1</span>
        What two colors make green?
      </h2>

      <div class="choice-list">
        <button id="answer-1">Red and Blue</button>
        <button id="answer-2">Blue and Yellow</button>
        <button id="answer-3">Red and Yellow</button>
      </div>
      <p id="feedback-1" class="feedback"></p>
    </div>


    <!-- QUESTION 2 -->

    <div class="card">

      <h2 id="question-2">
        <span class="question-number">2</span>
        What two colors make purple?
      </h2>

      <div class="choice-list">
        <button id="answer-4">Red and Blue</button>
        <button id="answer-5">Blue and Yellow</button>
        <button id="answer-6">Red and Yellow</button>
      </div>
      <p id="feedback-2" class="feedback"></p>
    </div>


    <!-- QUESTION 3 -->

    <div class="card">

      <h2 id="question-3">
        <span class="question-number">3</span>
        What two colors make orange?
      </h2>

      <div class="choice-list">
        <button id="answer-7">Blue and Yellow</button>
        <button id="answer-8">Red and Yellow</button>
        <button id="answer-9">Red and Blue</button>
      </div>
      <p id="feedback-3" class="feedback"></p>
    </div>
    
   </main>

    <script src="script.js"></script>

  </body>
</html>
